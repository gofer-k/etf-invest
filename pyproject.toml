[project]
name = "etf-ai-agent"
version = "0.1.0"
description = "Local ETF AI/quant analysis agent (CLI only)"
requires-python = ">=3.10"
dependencies = [
  "yfinance==0.2.50",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.5.2",
  "PyYAML==6.0.2",
  "matplotlib==3.9.2",
  "plotly==5.15.0",
  "vectorbt==0.24.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

testpaths = [
   "tests"
]